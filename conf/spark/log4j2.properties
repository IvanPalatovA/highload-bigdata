# Уровень логирования по умолчанию - только ERROR, чтобы убрать спам WARN
rootLogger.level = ERROR
rootLogger.appenderRefs = RFA
rootLogger.appenderRef.RFA.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Заглушаем предупреждения Hive Metastore и Hadoop
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = ERROR

logger.hive.name = org.apache.hadoop.hive
logger.hive.level = ERROR

logger.objectstore.name = org.apache.hadoop.hive.metastore.ObjectStore
logger.objectstore.level = ERROR

logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = WARN
